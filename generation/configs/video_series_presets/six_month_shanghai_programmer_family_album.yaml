extends: base_long_memory.yaml

user_prompt: |
  生成一个 40 岁东亚男性程序员的 6 个月人生相簿风格视频系列。
  主角是 Chen Wei，他已婚，和妻子关系稳定温暖，父母健在，也有几位成年好友和同事。
  故事围绕他的工作日常、夫妻生活、探望父母、朋友聚餐、城市散步和偶尔去欧洲旅行展开。
  主要 recurring characters 应包括 Wei、妻子、母亲或父亲、大学好友、同事或经理，以及一位跨文化朋友；所有人都必须是成年人。
  每个 clip 都要新增明确的人物事实或关系变化：谁如何照顾谁、谁记得共同经历、谁在工作中信任谁、谁在旅行中暴露偏好。
  避免重复“喝茶、散步、拍照、做饭表达爱”这些单一信息功能；同一 routine 必须揭示不同人物关系或角色细节。
  不要出现儿童、青少年、学生或未成年人。

timeline:
  start_date: "2025-05-01"
  time_span: "6_months"
  planning_reference_count: 150
