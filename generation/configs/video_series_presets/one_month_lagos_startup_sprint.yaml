extends: base_long_memory.yaml

user_prompt: |
  生成一个尼日利亚拉各斯成人创业团队的 1 个月长期记忆视频系列。
  主角是 34 岁的 Yoruba 女性产品设计师 Amara Okafor，她正在和几位成年合伙人、工程师、运营朋友准备一个金融科技 demo day。
  主要 recurring characters 应包括 Amara、她的技术合伙人、运营负责人、投资人朋友、室友或亲密朋友，以及一位家人长辈或职业导师；所有人都必须是成年人。
  故事围绕共享办公室冲刺、用户访谈、晚间排练、家庭晚餐、拉各斯交通和 demo day 前的压力展开。
  每个 clip 都要新增明确的记忆点：谁负责什么、谁和谁有分歧、谁私下支持谁、谁掌握某个客户线索、谁的工作习惯或声音/说话风格被反复识别。
  允许英语、尼日利亚英语、少量 Yoruba 文化元素自然出现，但不要刻板化；人物必须具体、真实、多维。
  不要出现儿童、青少年、学生或未成年人。

timeline:
  start_date: "2025-05-01"
  time_span: "1_month"
  planning_reference_count: 80
