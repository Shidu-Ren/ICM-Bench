extends: base_long_memory.yaml

user_prompt: |
  生成一个北非裔法国女性在马赛重新安家的 3 个月长期记忆视频系列。
  主角是 39 岁的 Moroccan French 城市规划顾问 Samira Benali，她从巴黎搬到马赛，重新连接工作、人际关系和家庭记忆。
  主要 recurring characters 应包括 Samira、她的伴侣、当地同事、邻居朋友、在市场工作的表亲、一位年长亲人或职业导师；所有人都必须是成年人。
  故事围绕新公寓、港口通勤、城市规划会议、周末市场、家庭聚餐、旧友来访和逐渐融入新社区展开。
  每个 clip 都要产生新的长期记忆事实：谁帮她适应城市、谁保留家族习惯、谁挑战她的职业判断、谁与她的旧生活产生冲突。
  可以自然包含法语、阿拉伯语问候、地中海城市生活和移民家庭经验，但人物必须具体而不刻板。
  不要出现儿童、青少年、学生或未成年人。

timeline:
  start_date: "2025-05-01"
  time_span: "3_months"
  planning_reference_count: 110
