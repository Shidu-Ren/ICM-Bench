extends: base_long_memory.yaml

user_prompt: |
  生成一个圣保罗成人社区剧团排练的 6 个月长期记忆视频系列。
  主角是 42 岁的 Afro Brazilian 舞台经理 Renata Silva，她带领一个成年社区剧团从读本会走到小剧场演出。
  主要 recurring characters 应包括 Renata、导演、演员朋友、服装师、灯光师、伴侣或长年好友；所有人都必须是成年人。
  故事围绕排练室、服装间、社区餐馆、后台、雨夜公交、剧场布置和演出前后的人际张力展开。
  每个 clip 都要新增可问信息：谁总是迟到但临场发挥强、谁保管关键道具、谁害怕上台、谁在冲突后修复关系、谁的声音在排练和生活中有反差。
  可以自然包含葡萄牙语短句、巴西城市文化、剧场工作和混合族裔社区生活，但避免刻板化。
  不要出现儿童、青少年、学生或未成年人。

timeline:
  start_date: "2025-05-01"
  time_span: "6_months"
  planning_reference_count: 150
